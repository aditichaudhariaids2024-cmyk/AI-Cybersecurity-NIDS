services:

  api:
    build: .
    container_name: nids-api
    ports:
      - "8000:8000"
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: nids-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      API_URL: http://api:8000/predict
    volumes:
      - ./data/training:/app/data/training
    command: streamlit run src/dashboard.py --server.address=0.0.0.0 --server.port=8501