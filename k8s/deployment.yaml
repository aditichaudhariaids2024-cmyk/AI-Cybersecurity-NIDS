apiVersion: apps/v1
kind: Deployment
metadata:
  name: nids-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nids-api
  template:
    metadata:
      labels:
        app: nids-api
    spec:
      containers:
        - name: nids-api
          image: nids-ai:latest
          imagePullPolicy: IfNotPresent

          command:
            - uvicorn
            - src.api:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20